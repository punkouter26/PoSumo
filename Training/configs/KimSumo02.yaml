# Kim fight — re-tune onto the CURRENT physics.
#
# kim_sumo01 was trained against box limb colliders. Limbs are now
# CapsuleCollider2D.
#
#   mlagents-learn Training/configs/KimSumo02.yaml --run-id=kim_sumo02 \
#     --initialize-from=kim_sumo01 --results-dir=Training/results \
#     --env=Builds/KimEnv/KimEnv.exe --num-envs=2 --no-graphics --base-port 5900
#
# Same behavior name as its trunk this time — unlike kim_sumo01, which had to
# stage matt_sumo04's weights under a Kim/ folder because --initialize-from
# resolves by the NEW behavior name. No staging directory needed here.
# network_settings MUST stay 512 x 3 to match kim_sumo01.
#
# Kim is the heavyweight anchor: deep planted stance, impact 0.014 @ cap 10,
# closing only 0.0004 because she does not chase. Rounded limbs matter less to a
# fighter who wins by being immovable than to Nick, so this is the most
# conservative of the four re-tunes — low learning rate, low beta, let her stay
# stolid.
#
# Her gamma stays 0.99 (the rest of the roster uses 0.997): short credit horizon,
# because the payoff is the shove in front of her, not a plan.

behaviors:
  Kim:
    trainer_type: ppo
    hyperparameters:
      batch_size: 4096
      buffer_size: 40960
      learning_rate: 1.0e-4
      beta: 3.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:      # MUST match kim_sumo01 exactly (initialize-from)
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 200000
    max_steps: 3000000
    time_horizon: 1000
    summary_freq: 30000
    threaded: true
    self_play:
      window: 10
      play_against_latest_model_ratio: 0.5
      save_steps: 50000
      swap_steps: 50000
      team_change: 250000
