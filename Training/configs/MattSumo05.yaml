# Matt's PERSONALITY fine-tune: first run driven by his character sheet's
# aggressive rewards (closing 0.0009, lunge 0.0016 @ 1.2 m/s, impact 0.015,
# energy 0.0003) via MattAggrEnv. Initialized from the finished 45M trunk;
# lower beta for fine-tuning. Self-play + frozen Standard sparring arena.
#   mlagents-learn Training/configs/MattSumo05.yaml --run-id=matt_sumo05 \
#     --initialize-from=matt_sumo04 --results-dir=Training/results \
# NOTE: matt_sumo04 now lives in Training/trunks/ (it backs no deployed brain, so
# it was moved out of the TensorBoard logdir). To re-run this exact command, copy
# it back first:  Copy-Item -Recurse Training/trunks/matt_sumo04 Training/results/
# For a plain continuation of the SHIPPED brain, --initialize-from=matt_sumo05.
#     --env=Builds/MattAggrEnv/MattAggrEnv.exe --num-envs=3 --no-graphics

behaviors:
  Matt:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 2.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 200000
    max_steps: 8000000
    time_horizon: 1000
    summary_freq: 30000
    threaded: true
    self_play:
      window: 15
      play_against_latest_model_ratio: 0.35
      save_steps: 50000
      swap_steps: 50000
      team_change: 250000
