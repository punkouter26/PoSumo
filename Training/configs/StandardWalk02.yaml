# Standard walk — corrective pass onto the REBUILT body.
#
# The walk brains are invalidated by the same realism pass as the fight brains,
# for a reason that matters more here than there: LIMB LENGTHS CHANGED. A gait is
# a timing relationship between leg length, mass and gravity, so re-deriving the
# segments to Winter (legs +0.084 m, trunk -0.043 m, foot 0.22 -> 0.268) changes
# stride, ground clearance and the moment the swing leg has to come through.
# standard_walk01 was tuned around the short-shank body and mistimes on this one.
#
# Also changed under it: joint ROM clamped to human total range, upper-body torque
# cut to human peak, and passive joint resistance plus real body damping — so a
# limb the policy is not actively holding no longer swings free.
#
# NOT changed: the walk school's own shaping. Standard's character-sheet gait
# profile carries over untouched, so this run re-derives HIS walk on the new body
# rather than retuning his style. The two terminals stay hardcoded (fall -1,
# graduation +3), which keeps this run comparable with standard_walk01 on one reward scale
# — unlike the fight runs, where new shaping terms broke that comparability.
#
#   mlagents-learn Training/configs/StandardWalk02.yaml --run-id=standard_walk02 #     --initialize-from=standard_walk01 --results-dir=Training/results #     --env=Builds/StandardWalkEnv/StandardWalkEnv.exe --num-envs=2 --no-graphics --base-port 5410
#
# network_settings MUST stay 512 x 3 to match standard_walk01.
#
# 2.5M steps at lr 1.5e-4: a gait re-time on a warm trunk, not a new gait.

behaviors:
  Standard:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 1.5e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:      # MUST match standard_walk01 exactly (initialize-from)
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 250000
    max_steps: 2500000
    time_horizon: 500
    summary_freq: 30000
    threaded: true
