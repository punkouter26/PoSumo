# Standard — walk school on the neutral 1.0 body with DEFAULT walk shaping.
#
# Standard currently runs the baseline gait produced by matt_walk01 (that run
# predates per-character walk shaping, so it was trained under exactly these
# defaults on exactly this body — which is why sharing it is legitimate rather
# than lazy). This config exists so that gait stays REPRODUCIBLE: Matt's walk
# scene now carries his own aggressive shaping, so re-running his scene would no
# longer reproduce Standard's walk.
#
#   mlagents-learn Training/configs/StandardWalk01.yaml --run-id=standard_walk01 \
#     --initialize-from=matt_walk01 --results-dir=Training/results \
#     --env=Builds/StandardWalkEnv/StandardWalkEnv.exe --num-envs=2 --no-graphics --base-port 5500
#
# --initialize-from resolves by behavior name and matt_walk01 stores its weights
# under Matt/, so a Standard run needs the trunk staged under Standard/ first:
#   New-Item -ItemType Directory -Force Training/results/std_walk_init/Standard
#   Copy-Item Training/results/matt_walk01/Matt/checkpoint.pt `
#     Training/results/std_walk_init/Standard/checkpoint.pt
#   ... then --initialize-from=std_walk_init, and delete it once the run is stepping.
#
# Not yet run — Standard's deployed StandardWalk.onnx is still matt_walk01's
# export, which is equivalent. Run this only if Standard's gait needs to diverge
# from the baseline, or to retrain it against the current capsule-limb colliders.
#
# network_settings MUST stay 512 x 3 to match the trunk.

behaviors:
  Standard:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 1.5e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:      # MUST match matt_walk01 exactly (initialize-from)
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 200000
    max_steps: 2000000
    time_horizon: 500
    summary_freq: 30000
    threaded: true
