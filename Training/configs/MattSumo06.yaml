# Matt fight — re-tune onto the CURRENT physics.
#
# matt_sumo05 was trained when every body part had a BoxCollider2D. Limbs are now
# CapsuleCollider2D, matched to the drawn capsule so contacts land where the art
# says they do. Feet and torso are unchanged, so balance and chest-to-chest
# shoving behave as before; what moved is how arms and legs catch, slide and roll
# off the opponent — which is exactly what Matt's impact-heavy style trades on.
#
#   mlagents-learn Training/configs/MattSumo06.yaml --run-id=matt_sumo06 \
#     --initialize-from=matt_sumo05 --results-dir=Training/results \
#     --env=Builds/MattAggrEnv/MattAggrEnv.exe --num-envs=2 --no-graphics --base-port 5600
#
# Same behavior name as its trunk, so no staging directory is needed.
# network_settings MUST stay 512 x 3 to match matt_sumo05.
#
# 3M corrective steps, not a fresh run: the trunk is ~53M effective steps deep
# (matt_sumo05 on top of matt_sumo04) and only the contact shape changed.
# learning_rate is halved from the original run for the same reason — this should
# nudge an existing fighter, not rebuild one.
#
# Self-play settings match matt_sumo05 so the opponent distribution is unchanged;
# altering both the physics and the curriculum at once would make a regression
# impossible to attribute.

behaviors:
  Matt:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 1.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:      # MUST match matt_sumo05 exactly (initialize-from)
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.997
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 200000
    max_steps: 3000000
    time_horizon: 1000
    summary_freq: 30000
    threaded: true
    self_play:
      window: 25
      play_against_latest_model_ratio: 0.25
      save_steps: 50000
      swap_steps: 50000
      team_change: 250000
