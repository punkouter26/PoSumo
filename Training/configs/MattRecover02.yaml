# Walk school 2.0 — sustained upright bent-knee walking. 8 m targets and a
# down-time penalty make crawling unprofitable; only standing, stepping,
# knees-bent locomotion graduates. Self-completes at 8M steps (~3 h).
#   mlagents-learn Training/configs/MattRecover02.yaml --run-id=matt_recover02 \
#     --initialize-from=matt_recover01 --results-dir=Training/results \
#     --env=Builds/RecoverEnv2/RecoverEnv2.exe --num-envs=2 --no-graphics --base-port 5150

behaviors:
  Matt:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 1.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 200000
    max_steps: 8000000
    time_horizon: 1000
    summary_freq: 30000
    threaded: true
