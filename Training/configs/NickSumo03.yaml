# Nick fight — re-tune onto the CURRENT physics.
#
# nick_sumo02 was trained against box limb colliders. Limbs are now
# CapsuleCollider2D.
#
#   mlagents-learn Training/configs/NickSumo03.yaml --run-id=nick_sumo03 \
#     --initialize-from=nick_sumo02 --results-dir=Training/results \
#     --env=Builds/NickEnv/NickEnv.exe --num-envs=2 --no-graphics --base-port 5800
#
# Same behavior name as its trunk, so no staging directory is needed.
# network_settings MUST stay 512 x 3 to match nick_sumo02.
#
# Nick has the most to gain and the most to lose here. His identity is footwork —
# the highest cadence and lunge rewards on the roster, straightLegEarnFraction
# 0.75 so he is not required to sit in a deep stance — which means he spends more
# time on the balls of rounded limbs than anyone. Rounded limbs slide differently.
#
# He is also the fighter whose v1 failure is documented in NickSumo02.yaml (paid
# too little for advancing, so he could not contest ground). Watch that the
# re-tune does not walk that back: if his reward climbs while he stops engaging,
# the fix is in his character sheet, not here.
#
# beta 7.0e-3, as in his other runs: he is allowed to re-explore contact timing.

behaviors:
  Nick:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 1.2e-4
      beta: 7.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:      # MUST match nick_sumo02 exactly (initialize-from)
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.997
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 200000
    max_steps: 3000000
    time_horizon: 1000
    summary_freq: 30000
    threaded: true
    self_play:
      window: 25
      play_against_latest_model_ratio: 0.25
      save_steps: 50000
      swap_steps: 50000
      team_change: 250000
