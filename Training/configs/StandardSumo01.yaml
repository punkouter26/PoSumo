# Phase B — sumo self-play for the extended Matt brain under exact game rules
# (fall-off-to-lose, shrinking platform, randomized width/friction), with a
# frozen Dave sparring arena for style diversity.
#   mlagents-learn Training/configs/StandardSumo01.yaml --run-id=standard_sumo01 \
#     --initialize-from=standard_recover01 --results-dir=Training/results \
#     --env=Builds/StandardEnv/MattEnv2.exe --num-envs=3 --no-graphics
# Wider self-play window + lower latest-ratio to fight style collapse.

behaviors:
  Standard:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 8.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 200000
    max_steps: 45000000
    time_horizon: 1000
    summary_freq: 30000
    threaded: true
    self_play:
      window: 15
      play_against_latest_model_ratio: 0.35
      save_steps: 50000
      swap_steps: 50000
      team_change: 250000

# Adaptive curriculum: each dial advances when Matt's smoothed mean reward
# clears the threshold, so difficulty tracks skill instead of wall-clock.
environment_parameters:
  spawn_gap_half:
    curriculum:
      - name: CloseQuarters
        completion_criteria:
          measure: reward
          behavior: Standard
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 0.45
        value: 0.9
      - name: FullGap
        value: 1.2
  shove_impulse:
    curriculum:
      - name: HeavyShoves
        completion_criteria:
          measure: reward
          behavior: Standard
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 0.45
        value: 45.0
      - name: ModerateShoves
        completion_criteria:
          measure: reward
          behavior: Standard
          signal_smoothing: true
          min_lesson_length: 300
          threshold: 0.6
        value: 25.0
      - name: NoShoves
        value: 0.0
  platform_difficulty:
    curriculum:
      - name: StableFloor
        completion_criteria:
          measure: reward
          behavior: Standard
          signal_smoothing: true
          min_lesson_length: 200
          threshold: 0.5
        value: 0.0
      - name: MediumFloor
        completion_criteria:
          measure: reward
          behavior: Standard
          signal_smoothing: true
          min_lesson_length: 300
          threshold: 0.65
        value: 0.5
      - name: FullChaos
        value: 1.0
