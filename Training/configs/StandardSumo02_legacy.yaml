# Sumo self-play, technique round (bent-knee stance + lunge shaping in
# Agent_Biped). Cold run (head collider grew 30%), warm-started:
#   mlagents-learn Training/configs/StandardSumo02.yaml --run-id=dave_sumo02 \
#     --initialize-from=dave_sumo01 --results-dir=Training/results \
#     --env=Builds/StandardEnv/StandardEnv.exe --num-envs=3 --no-graphics --base-port 5055
# beta raised 5e-3 -> 1e-2 for more movement exploration; checkpoints every
# 200k steps so a time-boxed stop always has a fresh .onnx.

behaviors:
  Standard:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 1.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 200000
    max_steps: 30000000
    time_horizon: 1000
    summary_freq: 30000
    threaded: true
    self_play:
      window: 10
      play_against_latest_model_ratio: 0.5
      save_steps: 50000
      swap_steps: 50000
      team_change: 200000
