# Phase A — recovery school for the extended (44-obs, period-3) Matt brain:
# get up from violent shoves, then walk to a target crouched and stepping.
#   mlagents-learn Training/configs/MattRecover01.yaml --run-id=matt_recover01 \
#     --results-dir=Training/results --env=Builds/RecoverEnv/RecoverEnv.exe \
#     --num-envs=3 --no-graphics
# Fresh network (obs size changed 41 -> 44, no warm start possible).

behaviors:
  Matt:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 1.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 200000
    max_steps: 30000000
    time_horizon: 500
    summary_freq: 30000
    threaded: true
