# Matt — his OWN restyled walk, so his locomotion brain is no longer shared with
# Standard. Same 1.0 baseline body as matt_walk01; what differs is the shaping,
# which now comes from his character sheet. After this run
# Matt_v01/MattWalk.onnx is his, and Standard keeps the baseline gait as
# Standard_v01/StandardWalk.onnx. Either can be retuned without touching the other.
#
# No staging directory needed here — unlike Kim and Nick, this run keeps the
# SAME behavior name as its trunk (matt_walk01 already stores weights under Matt/,
# because that run's behavior key was also `Matt`), so --initialize-from resolves
# directly.
#
#   mlagents-learn Training/configs/MattWalk02.yaml --run-id=matt_walk02 \
#     --initialize-from=matt_walk01 --results-dir=Training/results \
#     --env=Builds/MattWalkEnv/MattWalkEnv.exe --num-envs=2 --no-graphics --base-port 5400
#
# network_settings MUST stay 512 x 3 to match matt_walk01's weights.
#
# Mode.Walk shaping is now PER-CHARACTER (read from the character sheet at Awake,
# the way the Sumo branch already worked), so this run does not just re-derive the
# baseline gait — it trains Matt's own. His profile, vs the defaults the baseline
# gait was trained under:
#   walkForwardReward 0.0075 (0.004)  — drive forward hard
#   walkStanceFloor   0.30   (0.15)   — matches his sumo bendFloor; charges, not creeps
#   walkCadenceReward 0.0012 (0.002)  — fewer dainty steps
#   walkStallPenalty  0.0018 (0.0008) — standing still is expensive
#   walkEnergyPenalty 0.00018(0.0003) — effort is cheap when it buys ground
#   walkBendReward    0.0004 (0.0006) — less crouch emphasis
# Expect a longer-strided, more committed walk-in than Standard's.
#
# The two TERMINALS stay hardcoded (fall -1, graduation +3) so every character's
# walk run remains comparable on the same reward scale in TensorBoard.
#
# 2M steps: the body already matches the trunk, so this only has to re-settle the
# gait under the new shaping — not learn to walk on a new physique.

behaviors:
  Matt:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 1.5e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:      # MUST match matt_walk01 exactly (initialize-from)
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 200000
    max_steps: 2000000
    time_horizon: 500
    summary_freq: 30000
    threaded: true
