# Nick — walk school on the LIGHTWEIGHT body (mass 0.72, width 0.82, torque 0.85).
# Every fighter needs a locomotion brain because Agent_Biped.BeginWalkIn borrows
# it for the ceremonial round-opening walk-in; Kim and Nick were the two without
# one, so their walk-in silently did nothing.
#
# Warm start from the baseline gait in matt_walk01, adapted to a body that is
# 28% lighter with 15% less torque. A light frame is easier to keep upright than
# Kim's, so this gets the same 4M budget and a slightly higher learning rate.
#
#   New-Item -ItemType Directory -Force Training/results/nick_walk_init/Nick
#   Copy-Item Training/results/matt_walk01/Matt/checkpoint.pt `
#     Training/results/nick_walk_init/Nick/checkpoint.pt
#   mlagents-learn Training/configs/NickWalk01.yaml --run-id=nick_walk01 \
#     --initialize-from=nick_walk_init --results-dir=Training/results \
#     --env=Builds/NickWalkEnv/NickWalkEnv.exe --num-envs=2 --no-graphics --base-port 5300
#
# --initialize-from resolves by the NEW behavior name, hence the staged Nick/ folder.
# network_settings MUST stay 512 x 3 to match matt_walk01's weights.
#
# beta stays higher than Kim's (7.0e-3): his fight identity is footwork and
# cadence, so a little extra exploration in the gait is wanted, not suppressed.

behaviors:
  Nick:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 2.0e-4
      beta: 7.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:      # MUST match matt_walk01 exactly (initialize-from)
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 200000
    max_steps: 4000000
    time_horizon: 500
    summary_freq: 30000
    threaded: true
