# Nick v2 — corrective fine-tune. The round-robin exposed the flaw in v1: his
# "clever" shaping paid him almost nothing for advancing (closing 0.0005) in a
# game that is won by advancing, so he could not contest ground and lost 2-1 to
# Matt and 3-0 to Kim despite a healthy self-play ELO of ~1500. That ELO was
# earned against other equally passive Nicks and did not transfer.
#
# Fix is in his character sheet, not here: closing 0.0005 -> 0.0011 (above
# Matt's 0.0009) and impact 0.007 -> 0.011, while KEEPING the footwork identity
# (cadence 0.0032, lunge 0.0024 @ 1.0, hipsLow 0.0001, bendFloor 0.75). He
# should stay a mobile lightweight, just one that actually engages.
#
#   mlagents-learn Training/configs/NickSumo02.yaml --run-id=nick_sumo02 \
#     --initialize-from=nick_sumo01 --results-dir=Training/results \
#     --env=Builds/NickEnv/NickEnv.exe --num-envs=3 --no-graphics
#
# NOTE: nick_sumo01 has since been pruned — it backed no deployed brain and this
# run superseded it. Any further Nick run initializes from nick_sumo02, which is
# the brain currently shipping as Nick_v01/Nick.onnx.
#
# Continues from his own finished brain, so this is a short corrective run
# (4M steps) rather than a fresh 12M. --initialize-from resolves by behavior
# name and nick_sumo01 already stores weights under Nick/, so no staged init
# directory is needed this time.
#
# network_settings must stay 512 x 3 to match nick_sumo01.

behaviors:
  Nick:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 1.5e-4      # lower than v1: nudging a trained policy
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.997
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 200000
    max_steps: 4000000
    time_horizon: 1000
    summary_freq: 30000
    threaded: true
    self_play:
      window: 25
      play_against_latest_model_ratio: 0.25
      save_steps: 50000
      swap_steps: 50000
      team_change: 250000

# No curriculum this time. On v1 every lesson completed by step 300k because the
# thresholds were written for a cold start at ~0 reward while a warm start opens
# near 9 — so it gated nothing. Starting at full difficulty is honest here.
