# Matt walk — corrective pass onto the REBUILT body.
#
# The walk brains are invalidated by the same realism pass as the fight brains,
# for a reason that matters more here than there: LIMB LENGTHS CHANGED. A gait is
# a timing relationship between leg length, mass and gravity, so re-deriving the
# segments to Winter (legs +0.084 m, trunk -0.043 m, foot 0.22 -> 0.268) changes
# stride, ground clearance and the moment the swing leg has to come through.
# matt_walk02 was tuned around the short-shank body and mistimes on this one.
#
# Also changed under it: joint ROM clamped to human total range, upper-body torque
# cut to human peak, and passive joint resistance plus real body damping — so a
# limb the policy is not actively holding no longer swings free.
#
# NOT changed: the walk school's own shaping. Matt's character-sheet gait
# profile carries over untouched, so this run re-derives HIS walk on the new body
# rather than retuning his style. The two terminals stay hardcoded (fall -1,
# graduation +3), which keeps this run comparable with matt_walk02 on one reward scale
# — unlike the fight runs, where new shaping terms broke that comparability.
#
#   mlagents-learn Training/configs/MattWalk03.yaml --run-id=matt_walk03 #     --initialize-from=matt_walk02 --results-dir=Training/results #     --env=Builds/MattWalkEnv/MattWalkEnv.exe --num-envs=2 --no-graphics --base-port 5400
#
# network_settings MUST stay 512 x 3 to match matt_walk02.
#
# 2.5M steps at lr 1.5e-4: a gait re-time on a warm trunk, not a new gait.

#
# ── RESTARTED 2026-07-28: the leg and arm bent the wrong way ──────────────────
# The three asymmetric joints (hip, knee, elbow) had inverted ranges for the
# whole life of the project. HingeJoint2D.jointAngle here is the NEGATIVE of the
# child segment's geometric rotation (measured ratio -1.00 on every joint), so
# ranges written as if they were geometric produced a bird leg: the knee swung
# the shin FORWARD, the elbow swung the forearm BACKWARD, and the hip had 120
# degrees of extension against only 30 of flexion. The fighter could not crouch
# and drive off a loaded leg at all. Corrected to hip (-120..30), knee (0..150),
# elbow (-150..0) and re-verified in SCN_WALKVIEW with a parent-local probe.
#
# learning_rate raised 1.5e-4 -> 3.0e-4 for this restart ONLY. A corrective pass
# normally nudges a policy whose motor mapping still holds; here the sign of what
# every leg and arm action DOES has flipped, so the warm-started priors are
# actively wrong and need fresh-run adaptation speed to be overwritten.
behaviors:
  Matt:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:      # MUST match matt_walk02 exactly (initialize-from)
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 250000
    max_steps: 2500000
    time_horizon: 500
    summary_freq: 30000
    threaded: true
