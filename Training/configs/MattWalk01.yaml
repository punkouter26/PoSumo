# Walk school (final form) — Mode.Walk agents: falling terminates the episode
# (-1), so no on-the-ground reward exploit exists. Stance gating, cadence
# bonuses, and the anti-statue penalty keep the gait crouched and stepping.
# 5 m targets; graduation +3. Self-completes at 6M steps.
#   mlagents-learn Training/configs/StandardWalk01.yaml --run-id=standard_walk01 \
#     --initialize-from=matt_recover01 --results-dir=Training/results \
#     --env=Builds/WalkEnv/WalkEnv.exe --num-envs=2 --no-graphics --base-port 5150

behaviors:
  Matt:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 1.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 200000
    max_steps: 12000000
    time_horizon: 500
    summary_freq: 30000
    threaded: true
