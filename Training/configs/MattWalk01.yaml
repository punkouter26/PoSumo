# Walk school (final form) — Mode.Walk agents: falling terminates the episode
# (-1), so no on-the-ground reward exploit exists. Stance gating, cadence
# bonuses, and the anti-statue penalty keep the gait crouched and stepping.
# 5 m targets; graduation +3. Self-completes at 6M steps.
#
# This is the 1.0-BASELINE gait, trained on Matt's physique under behavior key
# `Matt` in SCN_TRAIN_WALK_MATT — hence run-id matt_walk01. Standard shares the
# resulting brain because its body is identical (mass/width/torque all 1.0); it is
# deployed as Standard_v01/StandardWalk.onnx, the fighter that still uses it.
# Kim and Nick are heavier/lighter and get their own walk schools
# (KimWalk01.yaml / NickWalk01.yaml), both warm-started from this run.
#
# Trained under the DEFAULT walk shaping (forward 0.004, stance floor 0.15,
# cadence 0.002, stall 0.0008). Those constants later became per-character fields
# on Agent_CharacterDefinition, defaulted to exactly these values — so this run
# stays reproducible. Matt's own restyled gait is MattWalk02.yaml.
#
# Was named StandardWalk01.yaml / run-id standard_walk01 until the walk runs were
# renamed to match their behavior names.
#   mlagents-learn Training/configs/MattWalk01.yaml --run-id=matt_walk01 \
#     --initialize-from=matt_recover01 --results-dir=Training/results \
#     --env=Builds/MattWalkEnv/MattWalkEnv.exe --num-envs=2 --no-graphics --base-port 5150

behaviors:
  Matt:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 1.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 200000
    max_steps: 12000000
    time_horizon: 500
    summary_freq: 30000
    threaded: true
