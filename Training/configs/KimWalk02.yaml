# Kim walk — re-tune onto the CURRENT physics.
#
# kim_walk01 learned its gait against box limb colliders. The limbs are now
# CapsuleCollider2D (matched to the drawn capsule so a kick connects where it
# looks like it connects), which changes how a leg slides along the clay and how
# limbs roll off each other. Her feet and torso are unchanged, so this is a
# re-tune, not a re-learn.
#
#   mlagents-learn Training/configs/KimWalk02.yaml --run-id=kim_walk02 \
#     --initialize-from=kim_walk01 --results-dir=Training/results \
#     --env=Builds/KimWalkEnv/KimWalkEnv.exe --num-envs=2 --no-graphics --base-port 5200
#
# Same behavior name as its trunk, so no staging directory is needed.
# network_settings MUST stay 512 x 3 to match kim_walk01.
#
# 2M rather than the 4M the original body adaptation needed: the body is
# identical this time, only the contact shape moved.

behaviors:
  Kim:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 1.2e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:      # MUST match kim_walk01 exactly (initialize-from)
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 200000
    max_steps: 2000000
    time_horizon: 500
    summary_freq: 30000
    threaded: true
