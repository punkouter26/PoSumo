# Matt fight — corrective pass onto the SHRUNK ring and the new push economy.
#
# Cannot be a --resume of mattsumo07: ringHalfWidth changed, and edge distance
# reaches the policy normalised by it, so every boundary observation moved. This
# warm-starts from that run's weights under a new id instead.
#
# What changed under the policy:
#   1. Ring half-width 5.5 -> 4.0, and the round-opening stand-off 0.9 -> 2.5.
#      Together those cut the distance needed to drive an opponent out from
#      4.6 m to 1.5 m. Measured play had EVERY round expire on the clock and be
#      settled on position; no bout ended by ring-out.
#   2. Dohyo friction 0.9 -> 0.55. At 0.9 the force to start sliding a 69.6 kg
#      opponent is 614 N while measured sustained push in contact was 71-500 N,
#      so nobody could move anybody. 0.55 puts the wall at 376 N. This is inside
#      the [0.5, 1.1] band training already randomises over.
#   3. A slick tawara band (0.7 m at 0.18 friction) at each rim, so a fighter
#      driven to the edge slides out instead of planting on full-grip clay.
#   4. Shaping rebalanced toward driving: closingReward x5, lungeBonus x3,
#      impactReward /3. Impact was 10-35x the reward for closing, which is the
#      shape that produces a policy farming contact instead of winning bouts.
#   5. Round timeout 30 s -> 20 s.
#
# Judge this on ELO SHAPE, not mean reward — the shaping coefficients moved, so
# reward is not comparable with mattsumo07.


#
# ── RESTARTED 2026-07-28: the leg and arm bent the wrong way ──────────────────
# The three asymmetric joints (hip, knee, elbow) had inverted ranges for the
# whole life of the project. HingeJoint2D.jointAngle here is the NEGATIVE of the
# child segment's geometric rotation (measured ratio -1.00 on every joint), so
# ranges written as if they were geometric produced a bird leg: the knee swung
# the shin FORWARD, the elbow swung the forearm BACKWARD, and the hip had 120
# degrees of extension against only 30 of flexion. The fighter could not crouch
# and drive off a loaded leg at all. Corrected to hip (-120..30), knee (0..150),
# elbow (-150..0) and re-verified in SCN_WALKVIEW with a parent-local probe.
#
# learning_rate raised 1.5e-4 -> 3.0e-4 for this restart ONLY. A corrective pass
# normally nudges a policy whose motor mapping still holds; here the sign of what
# every leg and arm action DOES has flipped, so the warm-started priors are
# actively wrong and need fresh-run adaptation speed to be overwritten.
behaviors:
  Matt:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:      # MUST match matt_sumo06 exactly (initialize-from)
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.997
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 250000
    max_steps: 2000000
    time_horizon: 1000
    summary_freq: 30000
    threaded: true
    self_play:
      window: 25
      play_against_latest_model_ratio: 0.25
      save_steps: 50000
      swap_steps: 50000
      team_change: 250000

# Ring-width curriculum. Systems_SumoMatchManager randomises platform half-width
# per round between startHalfRange (now 1.7 .. 5.5, widened from 1.7 .. 2.75 so it
# spans the new game ring). platform_difficulty drives how far toward the narrow
# end it may go, so ramping it teaches edge distance across SCALES instead of
# letting the policy memorise one mat width.
environment_parameters:
  platform_difficulty:
    curriculum:
      - name: wide
        completion_criteria:
          measure: progress
          behavior: Matt
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.3
        value: 0.0
      - name: mixed
        completion_criteria:
          measure: progress
          behavior: Matt
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.6
        value: 0.5
      - name: full
        value: 1.0
