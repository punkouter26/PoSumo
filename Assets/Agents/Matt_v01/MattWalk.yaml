# Phase 1 — solo walking to ring center (Training_Walk.unity, 8 parallel lanes).
# Run (venv active, from project root):
#   mlagents-learn Training/configs/MattWalk.yaml --run-id=matt_walk01 --results-dir=Training/results
# then press Play in the Unity Editor.

behaviors:
  Matt:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 15000000
    time_horizon: 1000
    summary_freq: 30000
    threaded: true
