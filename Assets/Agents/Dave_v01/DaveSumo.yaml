# Phase 2 — sumo self-play (PoSumo.unity, two wrestlers, team ids 0/1).
# Initialize from the phase-1 walking policy:
#   mlagents-learn Training/configs/DaveSumo.yaml --run-id=dave_sumo01 \
#     --initialize-from=dave_walk01 --results-dir=Training/results
# then press Play in the Unity Editor. ELO is logged to TensorBoard.

behaviors:
  Dave:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 30000000
    time_horizon: 1000
    summary_freq: 30000
    threaded: true
    self_play:
      window: 10
      play_against_latest_model_ratio: 0.5
      save_steps: 50000
      swap_steps: 50000
      team_change: 200000
