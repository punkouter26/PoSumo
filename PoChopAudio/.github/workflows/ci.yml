name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # The WinUI project targets net10.0-windows and will not build off Windows.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PoChopAudio.slnx

      # TreatWarningsAsErrors is on solution-wide, so this step is the whole lint gate.
      - name: Build
        run: dotnet build PoChopAudio.slnx --no-restore -c Release

      # u2netp.onnx is not in the repo, so the cutout tests skip themselves here.
      - name: Test
        run: dotnet test PoChopAudio.slnx --no-build -c Release
